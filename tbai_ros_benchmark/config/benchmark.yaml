        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
record_topics:
  - /clock
  - /anymal_d/state
  - /anymal_d/command
  - /cmd_vel
  - /anymal_d/change_controller
  - /gait_command
  - /gazebo/model_states
  - /tf
  - /tf_static
  - /elevation_mapping/elevation_map_raw
  - /rosout_agg
recording:
  require_motion_topic_after_activation: true
  missing_optional_topic_policy: record_unavailable
  compression: none
  export_csv: false

data_sources:
  state:
    topic: /anymal_d/state
    message_type: tbai_ros_msgs/RbdState
    timestamp_field: stamp
    array_field: rbd_state
    expected_array_length: 36
    position_frame: world
    orientation_convention: roll_pitch_yaw_zyx
    orientation_indices: [0, 1, 2]
    position_indices: [3, 4, 5]
    angular_velocity_base_indices: [6, 7, 8]
    linear_velocity_base_indices: [9, 10, 11]
    joint_position_slice: [12, 24]  
    joint_velocity_slice: [24, 36]
    contacts_field: contact_flags
    contact_order: [LF, RF, LH, RH]
  action:
    topic: /anymal_d/command
    message_type: tbai_ros_msgs/JointCommandArray
    timestamp_source: bag_receipt_time  
    array_field: joint_commands
    joint_key: joint_name
    fields: [desired_position, desired_velocity, kp, kd, torque_ff]

  velocity_request:
    topic: /cmd_vel
    message_type: geometry_msgs/Twist
    timestamp_source: bag_receipt_time

trajectory_metric: xy
trajectory:
  frame: world
  window: motion_start_to_termination
  sampling: native_state_timestamps
  smoothing: none
  max_sample_gap_sim_sec: 0.5
  max_segment_speed_mps: 5.0  
  invalid_sample_policy: mark_distance_unavailable
  duplicate_timestamp_policy: keep_first
  alignment: preserve_independent_timestamps
  unsuccessful_time_to_goal: null

runtime_sources:
  mpc: null
  wbc: null
  policy: null
runtime_statistics: [count, mean, median, p95, p99, max]
runtime_summary:
  output_unit: ms
  percentile_method: linear
  warmup_exclusion_sim_sec: 0.0
  window: motion_start_to_termination
  group_by: [trial, baseline, component]
  missing_source_policy: unavailable
  invalid_sample_policy: exclude_and_report_count
  required_measurement: completed_call_wall_duration

recovery:
  enabled: false  
  event_topic: null
  recoverable_rules: []  
  grace_sim_sec: null 
  max_attempts: null
  missing_source_policy: unavailable
  controller_switch_is_recovery: false
  preserve_incomplete_episodes: true

artifacts:
  metadata: metadata.yaml
  outcome: result.json
  events: events.jsonl
  runtimes: runtime_summary.json
  bag: recording.bag
  batch_summary: summary.csv
  process_log_pattern: "{process}.log"
  save_partial_results: true
  preserve_bag_on_analysis_error: true
  missing_metric_value: null
