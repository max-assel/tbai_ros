        exclude_goal_tolerance: true
  ramped_balance_beam:
    start_position: [0.0, 0.5, 0.2]
    start_orientation_xyzw: [0.0, 0.0, 1.0, 0.0]
    goal_position: [-8.5, 0.5, 0.575]
