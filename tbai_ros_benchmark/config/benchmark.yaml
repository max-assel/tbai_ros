        hold_sim_sec: 0.5
      course_boundary:
        frame: world
        x_bounds_m: [-9.0, 0.5]
        y_bounds_m: [0.0, 1.0]
        hold_sim_sec: 0.5
      no_progress:
        metric: best_goal_xy_distance_reduction
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  ramped_stepping_stones:
    start_position: [-0.5, 7.5, 0.2]
    start_orientation_xyzw: [0.0, 0.0, 1.0, 0.0]
    goal_position: [-8.0, 7.5, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 1.10
        hold_sim_sec: 0.5
      course_boundary:
        frame: world
        x_bounds_m: [-8.5, 0.0]
        y_bounds_m: [6.75, 8.25]
        hold_sim_sec: 0.5
      no_progress:
        metric: best_goal_xy_distance_reduction
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  rubble:
    start_position: [-2.5, 1.4, 0.15]
    start_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    goal_position: [3.5, 1.4, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 0.90
        hold_sim_sec: 0.5
      course_boundary:
        frame: world
        x_bounds_m: [-3.0, 4.0]
        y_bounds_m: [0.15, 2.65]
        hold_sim_sec: 0.5
      no_progress:
        metric: best_goal_xy_distance_reduction
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  side_stones:
    start_position: [-2.5, 0.0, 0.15]
    start_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    goal_position: [2.0, 0.0, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 0.80
        hold_sim_sec: 0.5
      course_boundary:
        frame: world
        x_bounds_m: [-3.0, 2.5]
        y_bounds_m: [-0.75, 0.75]
        hold_sim_sec: 0.5
      no_progress:
        metric: best_goal_xy_distance_reduction
        min_progress_m: 0.10
