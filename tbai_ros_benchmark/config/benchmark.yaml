  ramped_balance_beam:
    start_position: [0.0, 0.5, 0.2]
    goal_position: [-8.5, 0.5, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 1.10
        hold_sim_sec: 0.5
      course_boundary:
        x_bounds_m: [-9.0, 0.5]
        y_bounds_m: [0.0, 1.0]
        hold_sim_sec: 0.5
      no_progress:
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  ramped_stepping_stones:
    start_position: [-0.5, 7.5, 0.2]
    goal_position: [-8.0, 7.5, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
