
schema_version: 1
worlds: [balance_beam]
# other worlds: pegboard, ramped_balance_beam, ramped_stepping_stones, rubble, side_stones, sparse_stones, stairs, ramp_10
baselines: [MPC, RL, DTC]
repetitions: 1

scripts: 
  reset: ../../tbai_ros_gazebo/reset_gazebo.sh
  run: ../../tbai_ros_gazebo/run_experiment.sh
activation_timeout_wall_sec: 30
gazebo_gui: true  
rviz: true
startup_timeout_wall_sec: 120
trial_timeout_sim_sec: 60  # Maximum duration; success/failure may end it earlier.
trial_timeout_wall_sec: 180
output_dir: ../results  

execution:
  reset_mode: restart
  parallel_trials: 1
  automatic_retries: 0
  continue_after: [success, failure, timeout]
  stop_after: [error, interrupted]
  stop_on_cleanup_error: true
  overwrite_attempts: false

# All timeouts here use monotonic wall time; task duration uses /clock.
readiness:
  poll_wall_sec: 0.05
  state_stale_wall_sec: 1.0
  clock_stall_wall_sec: 5.0
  reset_timeout_wall_sec: 30
  mapping_timeout_wall_sec: 60  
  stable_stand_hold_sim_sec: 1.0
  reset_xy_tolerance_m: 0.15
  stable_stand_max_abs_roll_rad: 0.2
  stable_stand_max_abs_pitch_rad: 0.2
  stable_stand_max_base_speed_mps: 0.1

cleanup:
  recorder_sigint_timeout_wall_sec: 30
  process_sigint_timeout_wall_sec: 10
  process_sigterm_timeout_wall_sec: 5
  process_sigkill_timeout_wall_sec: 5

monitor:
  clock_topic: /clock
  state_topic: /anymal_d/state
  motion_topic: /cmd_vel
  model_name: robot
  measurement_start: first_nonzero_cmd_vel_after_run_script
  motion_linear_epsilon_mps: 0.001
  motion_angular_epsilon_radps: 0.001
  terminal_precedence: [error, failure, success, timeout]
  clock_regression_outcome: error
  stale_state_outcome: error
  stalled_clock_outcome: error
  record_intermediate_events: true
  intermediate_events: [failure_candidate_started, failure_candidate_cleared]
  reset_clock_on_recovery: false
success:
  xy_tolerance_m: 0.25
  hold_sim_sec: 1.0
  require_upright: true
  max_abs_roll_rad: 0.5
  max_abs_pitch_rad: 0.6

world_settings:
  balance_beam:
    start_position: [-3.0, 0.0, 0.15]
    start_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    goal_position: [2.0, 0.0, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 0.80
        hold_sim_sec: 0.5
      course_boundary:
        frame: world
        x_bounds_m: [-3.5, 2.5]
        y_bounds_m: [-0.75, 0.75]
        segments:
          - x_bounds_m: [-1.0, 1.0]
            y_bounds_m: [-0.25, 0.25]
        hold_sim_sec: 0.5
      no_progress:
        metric: best_goal_xy_distance_reduction
        min_progress_m: 0.10
        window_sim_sec: 10.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  pegboard:
