        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  rubble:
    start_position: [-2.5, 1.4, 0.15]
    goal_position: [3.5, 1.4, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 0.90
        hold_sim_sec: 0.5
      course_boundary:
        x_bounds_m: [-3.0, 4.0]
        y_bounds_m: [0.15, 2.65]
        hold_sim_sec: 0.5
      no_progress:
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  side_stones:
    start_position: [-2.5, 0.0, 0.15]
    goal_position: [2.0, 0.0, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 0.80
        hold_sim_sec: 0.5
      course_boundary:
        x_bounds_m: [-3.0, 2.5]
        y_bounds_m: [-0.75, 0.75]
        hold_sim_sec: 0.5
      no_progress:
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  sparse_stones:
    start_position: [-3.0, 1.4, 0.15]
    goal_position: [2.0, 1.4, 0.575]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 0.80
        hold_sim_sec: 0.5
      course_boundary:
        x_bounds_m: [-3.5, 2.5]
        y_bounds_m: [0.15, 2.65]
        hold_sim_sec: 0.5
      no_progress:
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
  stairs:
    start_position: [-2.5, 0.0, 0.15]
    goal_position: [3.0, 0.0, 1.5]
    failure:
      fall:
        min_base_height_world_m: 0.10
        max_abs_roll_rad: 0.80
        max_abs_pitch_rad: 1.00
        hold_sim_sec: 0.5
      course_boundary:
        x_bounds_m: [-3.0, 3.5]
        y_bounds_m: [-1.25, 1.25]
        hold_sim_sec: 0.5
      no_progress:
        min_progress_m: 0.10
        window_sim_sec: 15.0
        grace_sim_sec: 5.0
        exclude_goal_tolerance: true
record_topics:
  - /clock
  - /anymal_d/state
  - /anymal_d/command
  - /cmd_vel
  - /anymal_d/change_controller
  - /gait_command
  - /gazebo/model_states
  - /tf
  - /tf_static
  - /elevation_mapping/elevation_map_raw
  - /rosout_agg
data_sources:
  state:
    topic: /anymal_d/state
    timestamp_field: stamp
    array_field: rbd_state
    expected_array_length: 36
    position_indices: [3, 4, 5]
  action:
    topic: /anymal_d/command

  velocity_request:
    topic: /cmd_vel

trajectory:
  max_sample_gap_sim_sec: 0.5
  max_segment_speed_mps: 5.0  

runtime_sources:
  mpc: null
  wbc: null
  policy: null
runtime_summary:
  warmup_exclusion_sim_sec: 0.0
